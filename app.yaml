apiVersion: apps/v1
kind: Deployment
metadata:
  name: meecha-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: meecha-app
  template:
    metadata:
      labels:
        app: meecha-app
    spec:
      # 障害ノードからの迅速な切り離し設定
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10
      # Pod間の分散配置（可用性向上）
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: meecha-app
      containers:
        - name: meecha-app
          image: ghcr.io/meecha-org/meecha_back/meecha-app:latest
          ports:
            - containerPort: 8090

          # POD がリクエストを受けれるかの検証
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 3
            periodSeconds: 3
            failureThreshold: 2
          # Pod の生存確認（失敗時に再起動）
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          env:
            - name: GRPC_ADDR
              valueFrom:
                secretKeyRef:
                  name: meechasecret
                  key: GrpcServer

            - name: SessionSecret
              valueFrom:
                secretKeyRef:
                  name: meechasecret
                  key: SessionSecret

            - name: DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: meechasecret
                  key: AppdbDSN

            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: meechasecret
                  key: JwtPublicKey

            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: meechasecret
                  key: RedisHost
            - name: REDIS_TYPE
              value: "redis"
            - name: REDIS_MASTER_NAME
              value: "myMaster"
---
apiVersion: v1
kind: Service
metadata:
  name: meecha-app-svc
spec:
  type: LoadBalancer
  selector:
    app: meecha-app
  ports:
  - port: 8090
    targetPort: 8090

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: meecha-scaling-app
spec:
  maxReplicas: 20
  behavior:
    scaleDown:
      policies:
      - type: Pods
        value: 3
        periodSeconds: 1
      stabilizationWindowSeconds: 0
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Pods
        value: 3
        periodSeconds: 1
      selectPolicy: Max
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 50
        type: Utilization
    type: Resource
  minReplicas: 3
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: meecha-app
