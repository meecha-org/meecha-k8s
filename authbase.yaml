apiVersion: v1
kind: Service
metadata:
  name: authbase-svc
spec:
  type: LoadBalancer
  selector:
    app: meecha-auth
  ports:
    - name: api-port
      protocol: TCP
      port: 80
      targetPort: 8080
    - name: grpc-port
      protocol: TCP
      port: 9000
      targetPort: 9000
      
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meecha-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meecha-auth
  template:
    metadata:
      labels:
        app: meecha-auth
    spec:
      # 障害ノードからの迅速な切り離し設定
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10
      # Pod間の分散配置（可用性向上）
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: meecha-auth
      containers:
        - name: authbase
          image: mattuu0/authbase-auth:0.2.7
          ports:
            - containerPort: 8080
            - containerPort: 9000
            
          # POD がリクエストを受けれるかの検証
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 3
            failureThreshold: 2
          # Pod の生存確認（失敗時に再起動）
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          env:
            - name: GoogleClientID
              valueFrom:
                secretKeyRef:
                  name: meechasecret
                  key: GoogleClientID

            - name: GoogleClientSecret
              valueFrom:
                secretKeyRef:
                  name: meechasecret
                  key: GoogleClientSecret

            - name: GoogleCallback
              valueFrom:
                secretKeyRef:
                  name: meechasecret
                  key: GoogleCallback

            - name: TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: meechasecret
                  key: TokenSecret 

            - name: ADMIN_SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: meechasecret
                  key: AdminSessionKey

            - name: GRPC_ADDR
              value: ":9000"

            - name: CUSTOM_SCHEME
              value: "meecha"

            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: meechasecret
                  key: JwtPrivKey

            - name: DB_DSN
              valueFrom:
                secretKeyRef:
                  name: meechasecret
                  key: AuthdbDsn
            - name: AdminEmail
              valueFrom:
                secretKeyRef:
                  name: meechasecret
                  key: AdminEmail

            - name: AdminPassword
              valueFrom:
                secretKeyRef:
                  name: meechasecret
                  key: AdminPassword

          volumeMounts:
            - name: assets-vol
              mountPath: /assets/icons
      volumes:
        - name: assets-vol
          persistentVolumeClaim:
            claimName: meecha-claim

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: meecha-scaling-auth
spec:
  maxReplicas: 20
  behavior:
    scaleDown:
      policies:
      - type: Pods
        value: 3
        periodSeconds: 1
      stabilizationWindowSeconds: 0
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Pods
        value: 3
        periodSeconds: 1
      selectPolicy: Max
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 50
        type: Utilization
    type: Resource
  minReplicas: 1
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: meecha-auth
